<!DOCTYPE html>
<html lang="eng">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuizPulse - Interactive Quiz</title>
    <link rel="stylesheet" href="style14.css">
    <script src="script14.js" defer></script>
</head>
<body>

    <div class="container">
        <h1>QuizPulse</h1>
        <h2>Test Your Knowledge!</h2>
        <div id="quiz">
            <h3 id="question">Question appears here</h3>

            <div id="options">
                <button class="option">Option 1</button>
                <button class="option">Option 2</button>
                <button class="option">Option 3</button>
            </div>
            <p id="feedback"></p>

            <button id="next">Next Question</button>
        </div>

        <div id="result">
            <h2>Quiz Completed!</h2>
            <p id="score"></p>
            <button id="restart">Restart Quiz</button>
        </div>
    </div>
</body>
</html>
